                    nullable: true
                    type: integer
                baseDigest:
                    type: string
                cpus:
                    format: int
                    type: integer
                created:
                    format: dateTime
                    type: string
                diskBytes:
                    description: 'Size of the writable disk, a cap and not a reservation: blocks the guest never wrote take no space on the Workspace.'
                    format: int64
                    type: integer
                failedReason:
                    nullable: true
                    type: string
                hosts:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseSandboxHost'
                    type: array
                id:
                    type: string
                idleDeadline:
                    description: When the sandbox is parked for idleness, lastActivity plus idleTtlSeconds. Null without an idle TTL and while the sandbox is not running.
                    format: dateTime
                    nullable: true
                    type: string
                idleTtlSeconds:
                    format: int
                    nullable: true
                    type: integer
                lastActivity:
                    description: The last boot, call into the guest (exec, process, files, shell, SSH) or ingress request. An open shell or SSH connection counts as activity while it lasts.
                    format: dateTime
                    type: string
                launchContract:
                    $ref: '#/components/schemas/BaseSandboxLaunch'
                lineageId:
                    type: string
                memoryBytes:
                    format: int64
                    type: integer
                name:
                    nullable: true
                    type: string
                networkMode:
                    description: Fixed at create, design §5.8.
                    enum:
                        - AIRGAPPED
                        - PROJECT
                        - INTERNET
                        - PROJECT_INTERNET
                    type: string
                operation:
                    allOf:
                        - $ref: '#/components/schemas/BaseSandboxOperation'
                    description: The operation in flight on the sandbox, null when none is. One at a time, every other verb answers operationInFlight meanwhile.
                parentId:
                    nullable: true
                    type: string
                policy:
                    $ref: '#/components/schemas/BaseSandboxPolicy'
                policyGeneration:
                    format: int
                    type: integer
                secretBearing:
                    type: boolean
                secretsStale:
                    description: 'Derived: the Workspace environment changed something this sandbox was given, design §5.9.'
                    type: boolean
                stableAddress:
                    nullable: true
                    type: string
                status:
                    enum:
                        - CREATING
                        - RUNNING
                        - PARKING
                        - PARKED
                        - WAKING
                        - FORKING
                        - RESTORING
                        - FAILED
                        - TERMINATING
                        - TERMINATED
                        - ARCHIVED
                    type: string
                templateDigest:
                    nullable: true
                    type: string
                updated:
                    format: dateTime
                    type: string
            required:
                - id
                - lineageId
                - baseDigest
                - status
                - networkMode
                - policy
                - policyGeneration
                - launchContract
                - memoryBytes
                - cpus
                - diskBytes
                - secretBearing
                - secretsStale
                - hosts
                - lastActivity
                - created
                - updated
            type: object
        ResponseSandboxList:
            properties:
                items:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseSandbox'
                    type: array
            required:
                - items
            type: object
        ResponseSandboxSsh:
            properties:
                enabled:
                    description: Port 22 is open to project sources when the policy says so and the mode has a project path.
                    type: boolean
                hostKey:
                    description: Public host key of the agent's SSH server as an authorized-keys line, for pinning. Null on a sandbox from before the server.
                    nullable: true
                    type: string
                stableAddress:
                    nullable: true
                    type: string
            required:
                - enabled
            type: object
        ResponseSessionList:
            properties:
                items:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseGuestSession'
                    type: array
            required:
                - items
            type: object
        ResponseShell:
            properties:
                status:
                    type: string
            required:
                - status
            type: object
        ResponseSnapshot:
            properties:
                cpus:
                    description: Size of the sandbox when the snapshot was taken, null for a snapshot from before the record. A restore with memory keeps it.
                    format: int
                    nullable: true
                    type: integer
                created:
                    format: dateTime
                    type: string
                diskBytes:
                    format: int64
                    nullable: true
                    type: integer
                hasMemory:
                    type: boolean
                id:
                    type: string
                kind:
                    enum:
                        - AUTO
                        - PARK
                        - FORK
                        - NAMED
                        - PRE_IMPORT
                    type: string
                memoryBytes:
                    format: int64
                    nullable: true
                    type: integer
                name:
                    nullable: true
                    type: string
                sandboxId:
                    type: string
                secretBearing:
                    description: 'The sandbox had received secrets when the snapshot was taken, so its disk may hold them: it does not export, and a restore child is secret bearing.'
                    type: boolean
                sizeBytes:
                    format: int64
                    nullable: true
                    type: integer
            required:
                - id
                - sandboxId
                - kind
                - hasMemory
                - secretBearing
                - created
            type: object
        ResponseSnapshotList:
            properties:
                items:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseSnapshot'
                    type: array
            required:
                - items
            type: object
        ResponseSpawn:
            properties:
                operation:
                    $ref: '#/components/schemas/BaseOperation'
                sandboxes:
                    description: The new rows, in creating status until their child operation finishes.
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseSandbox'
                    type: array
            required:
                - operation
                - sandboxes
            type: object
        ResponseStream:
            properties:
                status:
                    type: string
            required:
                - status
            type: object
        ResponseSuccess:
            properties:
                success:
                    type: boolean
            required:
                - success
            type: object
        ResponseTemplate:
            properties:
                baseDigest:
                    type: string
                cpus:
                    format: int
                    type: integer
                created:
                    format: dateTime
                    type: string
                digest:
                    type: string
                diskBytes:
                    description: Size of the template's disk, the default of sandboxes spawned from it. A spawn of another disk size boots the template's disk cold.
                    format: int64
                    type: integer
                failedReason:
                    nullable: true
                    type: string
                hasMemory:
                    description: A warmed template carries the identity-free memory snapshot, design §5.1 step 3.
                    type: boolean
                memoryBytes:
                    description: The memory image is taken at this size, a sandbox spawned from the template takes it as its default and resumes only when it matches.
                    format: int64
                    type: integer
                name:
                    nullable: true
                    type: string
                policy:
                    $ref: '#/components/schemas/BaseTemplatePolicy'
                status:
                    description: 'DELETED is never listed: the image is gone and the row only stays because terminated sandboxes still name it.'
                    enum:
                        - BUILDING
                        - READY
                        - FAILED
                        - DELETED
                    type: string
                warmup:
                    description: 'Shell command run in the guest before its memory is captured, under the image''s launch environment: what it loads is resident in every spawn. Nothing listens and nothing has an identity, the image stays free of both.'
                    format: text
                    nullable: true
                    type: string
            required:
                - digest
                - baseDigest
                - status
                - policy
                - hasMemory
                - memoryBytes
                - cpus
                - diskBytes
                - created
            type: object
        ResponseTemplateList:
            properties:
                items:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseTemplate'
                    type: array
            required:
                - items
            type: object
        ResponseTokenIssued:
            properties:
                secret:
                    description: 'Returned exactly once, sent as `Authorization: Bearer <secret>` like the Workspace API key.'
                    type: string
                token:
                    $ref: '#/components/schemas/BaseToken'
            required:
                - token
                - secret
            type: object
        ResponseTokenList:
            properties:
                items:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseToken'
                    type: array
            required:
                - items
            type: object
        ResponseWebhookCreated:
            properties:
                endpoint:
                    $ref: '#/components/schemas/BaseWebhookEndpoint'
                signingSecret:
                    description: Returned exactly once.
                    type: string
            required:
                - endpoint
                - signingSecret
            type: object
        ResponseWebhookDeliveryList:
            properties:
                items:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseWebhookDelivery'
                    type: array
            required:
                - items
            type: object
        ResponseWebhookEndpoint:
            properties:
                created:
                    format: dateTime
                    type: string
                enabled:
                    type: boolean
                events:
                    description: Event types this endpoint subscribes to.
                    format: stringArray
                    items:
                        type: string
                    type: array
                id:
                    type: string
                url:
                    type: string
            required:
                - id
                - url
                - events
                - enabled
                - created
            type: object
        ResponseWebhookList:
            properties:
                items:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseWebhookEndpoint'
                    type: array
            required:
                - items
            type: object
        ResponseWorkspace:
            properties:
                alwaysDenied:
                    description: The read-only always-denied egress set, design §6.5.
                    format: stringArray
                    items:
                        type: string
                    type: array
                capacity:
                    $ref: '#/components/schemas/BaseWorkspaceCapacity'
                domains:
                    description: The host suffixes sandbox ports are published under, in the order their URLs are listed; empty means no public sandbox URL.
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseWorkspaceDomain'
                    type: array
                host:
                    $ref: '#/components/schemas/BaseWorkspaceHost'
                imageRelease:
                    description: The alias the Workspace image was built under, null on an image from before the record.
                    nullable: true
                    type: string
                policy:
                    $ref: '#/components/schemas/BaseWorkspacePolicy'
                substrate:
                    enum:
                        - FIRECRACKER
                    type: string
                usage:
                    $ref: '#/components/schemas/BaseWorkspaceUsage'
                version:
                    type: string
            required:
                - domains
                - substrate
                - version
                - policy
                - capacity
                - usage
                - host
                - alwaysDenied
            type: object
    securitySchemes:
        httpAuthorizationHeaderBearer:
            bearerFormat: opaque
            description: Http Authorization header using the Bearer scheme with opaque token.
            scheme: bearer
            type: http
