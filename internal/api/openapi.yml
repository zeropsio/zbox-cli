components:
    examples:
        ErrorBaseNotFound:
            value:
                code: baseNotFound
                message: Base not found
        ErrorBaseNotReady:
            value:
                code: baseNotReady
                message: Base is not ready
        ErrorConnectorNotFound:
            value:
                code: connectorNotFound
                message: Connector not found
        ErrorExportHasNoFile:
            value:
                code: exportHasNoFile
                message: 'The export has no file on this Workspace: it went to a bucket or did not finish'
        ErrorExportNotFound:
            value:
                code: exportNotFound
                message: Export not found
        ErrorExportRunning:
            value:
                code: exportRunning
                message: The export is still running
        ErrorForbidden:
            value:
                code: forbidden
                message: The token's scopes do not cover this route
        ErrorGuestFailed:
            value:
                code: guestFailed
                message: The sandbox agent failed
        ErrorGuestTimeout:
            value:
                code: guestTimeout
                message: The sandbox agent did not answer in time
        ErrorIdempotencyKeyConflict:
            value:
                code: idempotencyKeyConflict
                message: The idempotency key was already used with a different request
        ErrorInUse:
            value:
                code: inUse
                message: The object is still referenced and cannot be deleted
        ErrorIngressCredentialNotFound:
            value:
                code: ingressCredentialNotFound
                message: Ingress credential not found
        ErrorIntegrationAttachmentNotFound:
            value:
                code: integrationAttachmentNotFound
                message: Integration attachment not found
        ErrorIntegrationNotFound:
            value:
                code: integrationNotFound
                message: Integration not found
        ErrorInternalServerError:
            value:
                code: internalServerError
                message: Internal server error.
        ErrorInvalidSandboxStatus:
            value:
                code: invalidSandboxStatus
                message: The operation is not allowed in the sandbox's current status
        ErrorInvalidUserInput:
            value:
                code: invalidUserInput
                message: Invalid user input
        ErrorLineageNotFound:
            value:
                code: lineageNotFound
                message: Lineage not found
        ErrorNameConflict:
            value:
                code: nameConflict
                message: The name is already taken
        ErrorNotSupportedBySubstrate:
            value:
                code: notSupportedBySubstrate
                message: Not supported by the current substrate
        ErrorOperationInFlight:
            value:
                code: operationInFlight
                message: Another operation is in flight for this sandbox
        ErrorOperationNotFound:
            value:
                code: operationNotFound
                message: Operation not found
        ErrorPathNotFound:
            value:
                code: pathNotFound
                message: Path not found inside the sandbox
        ErrorPolicyGenerationConflict:
            value:
                code: policyGenerationConflict
                message: The policy changed since it was read
        ErrorPolicyViolation:
            value:
                code: policyViolation
                message: The request exceeds the template or Workspace ceiling
        ErrorQuarantineNotFound:
            value:
                code: quarantineNotFound
                message: Quarantine entry not found
        ErrorSandboxNotFound:
            value:
                code: sandboxNotFound
                message: Sandbox not found
        ErrorSandboxNotRunning:
            value:
                code: sandboxNotRunning
                message: Sandbox is not running
        ErrorSecretBearing:
            value:
                code: secretBearing
                message: A sandbox that received secrets cannot be forked or memory-snapshotted
        ErrorSecretsStale:
            value:
                code: secretsStale
                message: The Workspace environment changed something this sandbox was given, wake it explicitly with redeliverSecrets
        ErrorSessionNotFound:
            value:
                code: sessionNotFound
                message: Guest session not found
        ErrorSnapshotNotFound:
            value:
                code: snapshotNotFound
                message: Snapshot not found
        ErrorSubstrateFailed:
            value:
                code: substrateFailed
                message: The substrate failed
        ErrorTemplateNotFound:
            value:
                code: templateNotFound
                message: Template not found
        ErrorTemplateNotReady:
            value:
                code: templateNotReady
                message: Template is not ready
        ErrorTokenNotFound:
            value:
                code: tokenNotFound
                message: Token not found
        ErrorUnauthorized:
            value:
                code: unauthorized
                message: Missing or invalid Workspace API key or token
        ErrorWebhookNotFound:
            value:
                code: webhookNotFound
                message: Webhook endpoint not found
        ErrorWorkspaceFull:
            value:
                code: workspaceFull
                message: 'The Workspace has no room left for this: park a sandbox or scale the Workspace'
    parameters:
        IdempotencyKey:
            in: header
            name: Idempotency-Key
            required: true
            schema:
                type: string
        afterId:
            description: 'Workspace-wide cursor: return events with a greater id.'
            in: query
            name: afterId
            schema:
                description: 'Workspace-wide cursor: return events with a greater id.'
                format: int64
                nullable: true
                type: integer
        afterSeq:
            description: 'Per-sandbox cursor: return events with a greater seq.'
            in: query
            name: afterSeq
            schema:
                description: 'Per-sandbox cursor: return events with a greater seq.'
                format: int
                nullable: true
                type: integer
        beforeId:
            description: 'Cursor: the id of the last lineage of the previous page, the answer continues with the lineages created before it.'
            in: query
            name: beforeId
            schema:
                description: 'Cursor: the id of the last lineage of the previous page, the answer continues with the lineages created before it.'
                nullable: true
                type: string
        beforeSeq:
            description: 'Backwards cursor: return the newest events with a smaller seq, newest first. Implies newestFirst.'
            in: query
            name: beforeSeq
            schema:
                description: 'Backwards cursor: return the newest events with a smaller seq, newest first. Implies newestFirst.'
                format: int
                nullable: true
                type: integer
        cols:
            in: query
            name: cols
            schema:
                format: int
                nullable: true
                type: integer
        digest:
            in: path
            name: digest
            required: true
            schema:
                type: string
        from:
            in: query
            name: from
            schema:
                format: dateTime
                nullable: true
                type: string
        id:
            in: path
            name: id
            required: true
            schema:
                type: string
        includeRevoked:
            in: query
            name: includeRevoked
            schema:
                nullable: true
                type: boolean
        kind:
            in: query
            name: kind
            schema:
                enum:
                    - PTY
                    - EXEC
                    - SSH
                nullable: true
                type: string
        limit:
            in: query
            name: limit
            schema:
                format: int
                nullable: true
                type: integer
        lineageId:
            in: query
            name: lineageId
            schema:
                nullable: true
                type: string
        mode:
            description: Octal file mode, defaults to 0644.
            in: query
            name: mode
            schema:
                description: Octal file mode, defaults to 0644.
                nullable: true
                type: string
        name:
            description: Name the built base takes, moved from the base that held it, so a rebuild under the same name replaces it for `zbox new --base`.
            in: query
            name: name
            schema:
                description: Name the built base takes, moved from the base that held it, so a rebuild under the same name replaces it for `zbox new --base`.
                nullable: true
                type: string
        newestFirst:
            description: Answer the newest events first instead of the oldest. waitSeconds is ignored in this order.
            in: query
            name: newestFirst
            schema:
                description: Answer the newest events first instead of the oldest. waitSeconds is ignored in this order.
                nullable: true
                type: boolean
        parentId:
            in: query
            name: parentId
            schema:
                nullable: true
                type: string
        path:
            description: Absolute path inside the sandbox.
            in: query
            name: path
            required: true
            schema:
                description: Absolute path inside the sandbox.
                type: string
        rows:
            in: query
            name: rows
            schema:
                format: int
                nullable: true
                type: integer
        sandboxId:
            in: query
            name: sandboxId
            schema:
                nullable: true
                type: string
        sessionId:
            description: Reconnect to an open PTY session instead of opening a new one.
            in: query
            name: sessionId
            schema:
                description: Reconnect to an open PTY session instead of opening a new one.
                nullable: true
                type: string
        sessionTicket:
            in: query
            name: sessionTicket
            schema:
                nullable: true
                type: string
        status:
            in: query
            name: status
            schema:
                enum:
                    - OPEN
                    - CLOSED
                    - FAILED
                nullable: true
                type: string
        to:
            in: query
            name: to
            schema:
                format: dateTime
                nullable: true
                type: string
        waitSeconds:
            description: Hold the answer until the operation finishes or fails, at most this many seconds (30 at most). Omitted or 0 answers at once.
            in: query
            name: waitSeconds
            schema:
                description: Hold the answer until the operation finishes or fails, at most this many seconds (30 at most). Omitted or 0 answers at once.
                format: int
                nullable: true
                type: integer
        withMemory:
            description: Resume the archive's memory image, the default. Only an archive this Workspace exported resumes, any other boots cold from its disk.
            in: query
            name: withMemory
            schema:
                description: Resume the archive's memory image, the default. Only an archive this Workspace exported resumes, any other boots cold from its disk.
                nullable: true
                type: boolean
    schemas:
        BaseBandwidth:
            properties:
                burstBytes:
                    format: int64
                    type: integer
                rxBytesPerSecond:
                    format: int64
                    type: integer
                txBytesPerSecond:
                    format: int64
                    type: integer
            required:
                - rxBytesPerSecond
                - txBytesPerSecond
                - burstBytes
            type: object
        BaseBase:
            properties:
                created:
                    format: dateTime
                    type: string
                digest:
                    type: string
                exposePorts:
                    format: intArray
                    items:
                        type: integer
                    type: array
                failedReason:
                    nullable: true
                    type: string
                imageRef:
                    description: The registry reference or archive URL the base was pulled from, `build:<operationId>` for one built from a Dockerfile.
                    type: string
                kernelDigest:
                    nullable: true
                    type: string
                labels:
                    format: map
                    type: object
                launchContract:
                    $ref: '#/components/schemas/BaseLaunchContract'
                name:
                    description: Unique among the live bases. A pull or build that names an existing name takes it over, the earlier base stays unnamed.
                    nullable: true
                    type: string
                sizeBytes:
                    format: int64
                    nullable: true
                    type: integer
                status:
                    description: 'DELETED is never listed: the image is gone and the row only stays because terminated sandboxes still name it.'
                    enum:
                        - PULLING
                        - FLATTENING
                        - READY
                        - FAILED
                        - DELETED
                    type: string
            required:
                - digest
                - imageRef
                - status
                - launchContract
                - exposePorts
                - labels
                - created
            type: object
        BaseConnector:
            properties:
                credentialEnv:
                    description: The Workspace environment variable the credential lives in.
                    type: string
                credentialKind:
                    description: What the stored credential is. Null while disconnected.
                    enum:
                        - OAUTH_TOKEN
                        - API_KEY
                    nullable: true
                    type: string
                guestEnv:
                    description: Environment variables a sandbox receives when it attaches the connector's integrations at create.
                    format: stringArray
                    items:
                        type: string
                    type: array
                integrations:
                    description: The integrations the connector manages, created when it connects.
                    format: stringArray
                    items:
                        type: string
                    type: array
                loginAvailable:
                    description: Whether the connector can obtain its credential through a browser login in a helper sandbox.
                    type: boolean
                name:
                    description: 'The connector and the name of its main integration: claude, github, codex.'
                    type: string
                status:
                    description: CONNECTED when the Workspace env holds a credential for the connector.
                    enum:
                        - CONNECTED
                        - DISCONNECTED
                    type: string
                title:
                    type: string
            required:
                - name
                - title
                - status
                - credentialEnv
                - integrations
                - guestEnv
                - loginAvailable
            type: object
        BaseDomainFilter:
            properties:
                enforcement:
                    enum:
                        - ADVISORY
                        - PROXY
                    type: string
                names:
                    format: stringArray
                    items:
                        type: string
                    type: array
            required:
                - names
                - enforcement
            type: object
        BaseEgress:
            properties:
                allow:
                    description: Destinations the sandbox may reach within its network mode. With an egress document present, nothing else is reachable but the credential proxy and the resolver.
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseEgressRule'
                    type: array
                bandwidth:
                    allOf:
                        - $ref: '#/components/schemas/BaseBandwidth'
                    description: Not enforced yet, refused when set.
                deny:
                    description: Destinations dropped ahead of every allow rule.
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseEgressRule'
                    type: array
                dns:
                    description: Which resolver the sandbox reaches on port 53. There is no egress resolver yet, EGRESS is refused.
                    enum:
                        - PROJECT
                        - EGRESS
                        - NONE
                    type: string
                domainFilter:
                    allOf:
                        - $ref: '#/components/schemas/BaseDomainFilter'
                    description: Not enforced yet, refused when set.
                maxConnections:
                    description: Not enforced yet, refused when set.
                    format: int
                    nullable: true
                    type: integer
                packets:
                    allOf:
                        - $ref: '#/components/schemas/BasePacketRate'
                    description: Not enforced yet, refused when set.
            required:
                - allow
                - deny
                - dns
            type: object
        BaseEgressRule:
            properties:
                cidr:
                    description: An IPv4 prefix, a bare address, or the named set `project` for the project network.
                    type: string
                ports:
                    description: Destination ports. Empty means every port.
                    format: intArray
                    items:
                        type: integer
                    type: array
            required:
                - cidr
                - ports
            type: object
        BaseEvent:
            properties:
                created:
                    format: dateTime
                    type: string
                fromStatus:
                    enum:
                        - CREATING
                        - RUNNING
                        - PARKING
                        - PARKED
                        - WAKING
                        - FORKING
                        - RESTORING
                        - FAILED
                        - TERMINATING
                        - TERMINATED
                        - ARCHIVED
                    nullable: true
                    type: string
                id:
                    description: Workspace-wide cursor.
                    format: int64
                    type: integer
                operationId:
                    nullable: true
                    type: string
                payload:
                    format: jsonRawMessage
                    nullable: true
                    type: object
                sandboxId:
                    type: string
                seq:
                    description: Per-sandbox cursor.
                    format: int
                    type: integer
                toStatus:
                    enum:
                        - CREATING
                        - RUNNING
                        - PARKING
                        - PARKED
                        - WAKING
                        - FORKING
                        - RESTORING
                        - FAILED
                        - TERMINATING
                        - TERMINATED
                        - ARCHIVED
                    nullable: true
                    type: string
                type:
                    description: 'FAILED: the sandbox turned FAILED. OPERATION_FAILED: an operation failed and the sandbox kept a usable status, the payload''s reason says why.'
                    enum:
                        - CREATED
                        - READY
                        - PARKED
                        - WOKE
                        - FORKED
                        - RESTORED
                        - SNAPSHOT_TAKEN
                        - POLICY_CHANGED
                        - SECRETS_STALE
                        - EXPORTED
                        - FAILED
                        - OPERATION_FAILED
                        - ARCHIVED
                        - DELETED
                        - SESSION_OPENED
                        - SESSION_CLOSED
                        - HOOK_FINISHED
                    type: string
            required:
                - id
                - sandboxId
                - seq
                - type
                - created
            type: object
        BaseExport:
            properties:
                created:
                    format: dateTime
                    type: string
                destination:
                    description: 'The archive: `<url>/<bucket>/<key>` for S3, the download route `/api/rest/export/{id}/archive` of this API for FILE.'
                    type: string
                error:
                    nullable: true
                    type: string
                finished:
                    format: dateTime
                    nullable: true
                    type: string
                hasMemory:
                    type: boolean
                id:
                    type: string
                kind:
                    description: UPLOADED is an archive uploaded through `POST /import/upload`, its sandboxId and snapshotId are those of the Workspace that exported it.
                    enum:
                        - FULL
                        - INCREMENTAL
                        - UPLOADED
                    type: string
                lineageId:
                    type: string
                sandboxId:
                    type: string
                sinceExportId:
                    nullable: true
                    type: string
                sizeBytes:
                    format: int64
                    nullable: true
                    type: integer
                snapshotId:
                    description: The snapshot that was exported, null for the parked sandbox itself.
                    nullable: true
                    type: string
                snapshotName:
                    type: string
                status:
                    enum:
                        - RUNNING
                        - FINISHED
                        - FAILED
                    type: string
                storage:
                    description: S3 is an object in the caller's bucket, FILE a file on the Workspace's data volume that `GET /export/{id}/archive` downloads until the file retention removes it with the row.
                    enum:
                        - S3
                        - FILE
                    type: string
            required:
                - id
                - lineageId
                - sandboxId
                - hasMemory
                - kind
                - snapshotName
                - storage
                - destination
                - status
                - created
            type: object
        BaseFileEntry:
            properties:
                mode:
                    type: string
                modified:
                    format: dateTime
                    type: string
                name:
                    type: string
                size:
                    format: int64
                    type: integer
                target:
                    nullable: true
                    type: string
                type:
                    enum:
                        - FILE
                        - DIRECTORY
                        - SYMLINK
                        - OTHER
                    type: string
            required:
                - name
                - type
                - size
                - mode
                - modified
            type: object
        BaseGuestSession:
            properties:
                closed:
                    format: dateTime
                    nullable: true
                    type: string
                command:
                    $ref: '#/components/schemas/BaseSessionCommand'
                created:
                    format: dateTime
                    type: string
                exitCode:
                    format: int
                    nullable: true
                    type: integer
                hasOutput:
                    description: Whether a recorded output stream can be fetched.
                    type: boolean
                id:
                    type: string
                kind:
                    enum:
                        - PTY
                        - EXEC
                        - SSH
                    type: string
                sandboxId:
                    type: string
                status:
                    enum:
                        - OPEN
                        - CLOSED
                        - FAILED
                    type: string
            required:
                - id
                - sandboxId
                - kind
                - status
                - hasOutput
                - created
            type: object
        BaseHooks:
            properties:
                beforePark:
                    nullable: true
                    type: string
                onBoot:
                    nullable: true
                    type: string
                onFork:
                    nullable: true
                    type: string
                onWake:
                    nullable: true
                    type: string
                timeoutSeconds:
                    format: int
                    nullable: true
                    type: integer
            type: object
        BaseIngress:
            properties:
                holdTimeoutSeconds:
                    format: int
                    nullable: true
                    type: integer
                maxBodyBytes:
                    description: Accepted but not enforced yet.
                    format: int64
                    nullable: true
                    type: integer
                maxConnections:
                    description: Accepted but not enforced yet.
                    format: int
                    nullable: true
                    type: integer
                maxHeldRequests:
                    description: Accepted but not enforced yet.
                    format: int
                    nullable: true
                    type: integer
                ports:
                    format: objectArray
                    items:
                        $ref: '#/components/schemas/BaseIngressPort'
                    type: array
                rate:
                    allOf:
                        - $ref: '#/components/schemas/BaseRate'
                    description: Accepted but not enforced yet.
                ssh:
                    description: Open port 22 to project sources, design §7.2.
                    nullable: true
                    type: boolean
                waitPage:
                    description: Digest of a static page artifact served while a request is held.
                    nullable: true
                    type: string
            required:
                - ports
            type: object
        BaseIngressCredential:
            properties:
                created:
                    format: dateTime
                    type: string
                expires:
                    format: dateTime
                    type: string
                id:
                    type: string
                kind:
                    enum:
                        - TICKET
                        - SESSION
                        - TOKEN
                    type: string
                name:
                    nullable: true
                    type: string
                port:
                    format: int
                    type: integer
                revokedAt:
                    format: dateTime
                    nullable: true
                    type: string
                sandboxId:
                    type: string
                usedAt:
                    description: 'TICKET only: when it was exchanged for a session.'
                    format: dateTime
                    nullable: true
                    type: string
            required:
                - id
                - kind
                - sandboxId
                - port
                - expires
                - created
            type: object
        BaseIngressPort:
            properties:
                access:
                    description: 'Who the router lets through, design §6.2 step 3. Defaults to MEMBERS. MEMBERS and TICKET take a ticket once as `?ticket=` and then the session cookie. TOKEN takes `X-Zerops-Box-Authorization: Bearer <token>` on every request, or the token once as `?token=` for the session cookie. PROJECT answers the project network only, PUBLIC anyone. The router passes `Authorization` to the sandbox untouched and strips `X-Zerops-Box-Authorization`, the session cookie and both query parameters.'
                    enum:
                        - PROJECT
                        - MEMBERS
                        - TICKET
                        - TOKEN
                        - PUBLIC
                    type: string
                aliases:
                    description: Customer-owned hostnames mapped to this port.
                    format: stringArray
                    items:
                        type: string
                    nullable: true
                    type: array
                port:
                    description: The port inside the guest.
                    format: int
                    type: integer
                protocol:
                    enum:
                        - HTTP
                        - TCP
                    type: string
                wakeOnRequest:
                    description: Whether a request may wake a parked sandbox. Defaults on for authenticated modes and off for PUBLIC.
                    nullable: true
                    type: boolean
                websocket:
                    nullable: true
                    type: boolean
            required:
                - port
                - protocol
                - access
            type: object
        BaseInject:
            properties:
                header:
                    description: 'HEADER only: the header name the credential is sent in.'
                    nullable: true
                    type: string
                type:
                    enum:
                        - HEADER
                        - BEARER
                        - BASIC
                    type: string
            required:
                - type
            type: object
        BaseIntegration:
            properties:
                created:
                    format: dateTime
                    type: string
                credentialEnv:
                    description: Name of the Workspace environment variable holding the credential. Read on every request, never stored.
                    type: string
                inject:
                    $ref: '#/components/schemas/BaseInject'
                name:
                    type: string
                rateLimit:
                    $ref: '#/components/schemas/BaseRate'
                stripPrefix:
                    nullable: true
                    type: string
                targetUrl:
                    type: string
            required:
                - name
                - targetUrl
                - credentialEnv
                - inject
                - created
            type: object
        BaseIntegrationAttachment:
            properties:
                created:
                    format: dateTime
                    type: string
                integrationName:
                    nullable: true
                    type: string
                name:
                    description: The label the sandbox resolves as http://{name}.int.<workspace-domain>/.
                    type: string
                peerPort:
                    format: int
                    nullable: true
                    type: integer
                peerSandboxId:
                    nullable: true
                    type: string
                sandboxId:
                    type: string
            required:
                - sandboxId
                - name
                - created
            type: object
        BaseLaunchContract:
            properties:
                cmd:
                    format: stringArray
                    items:
                        type: string
                    nullable: true
                    type: array
                entrypoint:
                    format: stringArray
                    items:
                        type: string
                    nullable: true
                    type: array
                env:
                    format: map
                    nullable: true
                    type: object
                workingDir:
                    nullable: true
                    type: string
            type: object
        BaseLineage:
            properties:
                created:
                    format: dateTime
                    type: string
                exportEnabled:
                    type: boolean
                id:
                    type: string
            required:
                - id
                - exportEnabled
                - created
            type: object
        BaseMetricHourly:
            properties:
                cpuSeconds:
                    format: float
                    type: number
                diskBytes:
                    format: int64
                    type: integer
                hour:
                    format: dateTime
                    type: string
                memoryPssAvg:
                    format: int64
                    type: integer
                memoryPssMax:
                    format: int64
                    type: integer
                netRxBytes:
                    format: int64
                    type: integer
                netTxBytes:
                    format: int64
                    type: integer
                proxyRequests:
                    format: int64
                    type: integer
                routerBytes:
                    format: int64
                    type: integer
                routerRequests:
                    format: int64
                    type: integer
                sandboxId:
                    type: string
            required:
                - sandboxId
                - hour
                - cpuSeconds
                - memoryPssAvg
                - memoryPssMax
                - diskBytes
                - netRxBytes
                - netTxBytes
                - routerRequests
                - routerBytes
                - proxyRequests
            type: object
        BaseOperation:
            properties:
                created:
                    format: dateTime
                    type: string
                error:
                    nullable: true
                    type: string
                finished:
                    format: dateTime
                    nullable: true
                    type: string
                id:
                    type: string
                kind:
                    enum:
                        - CREATE
                        - PARK
                        - WAKE
                        - FORK
                        - RESTORE
                        - SNAPSHOT
                        - EXPORT
                        - IMPORT
                        - TERMINATE
                        - PULL_BASE
                        - BUILD_BASE
                        - BUILD_TEMPLATE
